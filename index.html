<!DOCTYPE html>
<html>
<head>
    <title>LINE LIFF QR Code Check-in</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
        }
        /* 狀態訊息固定在最上方，掃完回來一定看得到 */
        #result {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            font-size: 18px;
            font-weight: bold;
            white-space: pre-line;
        }
        .checkin-button {
            display: block;
            margin: 13px auto;
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            cursor: pointer;
            transition: transform 0.4s;
        }
        .checkin-button:hover {
            transform: scale(1.05);
        }
        .checkin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #morning-on { background-color: #2196F3; }
        #morning-off { background-color: #2196F3; }
        #noon-on { background-color: #4CAF50; }
        #noon-off { background-color: #4CAF50; }
        #night-on { background-color: #FF5722; }
        #night-off { background-color: #FF5722; }
        .info {
            color: #1565C0; /* 藍色 - 進行中 */
        }
        .success {
            color: #2E7D32; /* 綠色 - 成功訊息 */
        }
        .error {
            color: #D32F2F; /* 紅色 - 失敗/錯誤訊息 */
        }
    </style>
</head>
<body>
    <div id="result" class="info">初始化中…</div>

    <button id="morning-on" class="checkin-button" onclick="checkIn('早診上班')">早診上班</button>
    <button id="morning-off" class="checkin-button" onclick="checkIn('早診下班')">早診下班</button>
    <button id="noon-on" class="checkin-button" onclick="checkIn('午診上班')">午診上班</button>
    <button id="noon-off" class="checkin-button" onclick="checkIn('午診下班')">午診下班</button>
    <button id="night-on" class="checkin-button" onclick="checkIn('晚診上班')">晚診上班</button>
    <button id="night-off" class="checkin-button" onclick="checkIn('晚診下班')">晚診下班</button>

    <script>
        // 除錯用：網址加上 ?debug=1 時，在手機上顯示 console
        if (location.search.includes('debug=1')) {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = () => eruda.init();
            document.head.appendChild(s);
        }

        const LIFF_ID = '2008774294-naMUSdho';
        const CODE_URL = 'https://script.google.com/macros/s/AKfycbzykHa1eeljaiDiUB0EjRkkTxiEvEKwhdKELElyN096ttCxmXSAHzb8YmTxw6r6AtCLjg/exec';
        const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScgi5JwWSRiITnEJuj6nLuAJjX1FKXHTCyziAVv8g07KT4eMw/formResponse';
        const ENTRY_SHIFT = 'entry.1366094180';
        const ENTRY_USER = 'entry.538125100';
        const ENTRY_CODE = 'entry.1841717274';

        let userId = '';
        let busy = false;

        function setBusy(b) {
            busy = b;
            document.querySelectorAll('.checkin-button').forEach(btn => btn.disabled = b);
        }

        function displayMessage(message, type) {
            const resultElement = document.getElementById('result');
            resultElement.innerText = message;
            resultElement.className = type; // info / success / error
            resultElement.scrollIntoView({ block: 'start' });
        }

        async function fetchWithTimeout(url, options = {}, ms = 10000) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            try {
                return await fetch(url, { ...options, signal: ctrl.signal });
            } finally {
                clearTimeout(t);
            }
        }

        async function initializeLIFF() {
            setBusy(true); // 取得 LINE 身分之前，先鎖住按鈕
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                userId = profile.userId;
                console.log('User ID:', userId);
                displayMessage('請選擇班別，再掃描診所 QR Code', 'info');
                setBusy(false);
            } catch (error) {
                console.error('LIFF 初始化失敗:', error);
                displayMessage('LIFF 初始化失敗，請關閉後重新開啟。', 'error');
            }
        }

        async function getDailyCode() {
            try {
                const response = await fetchWithTimeout(CODE_URL, {}, 10000);
                const data = await response.json();
                return data.code;
            } catch (error) {
                console.error('獲取每日亂碼失敗:', error);
                displayMessage(
                    error.name === 'AbortError'
                        ? '取得驗證碼逾時，請重試。'
                        : '無法獲取每日亂碼，請稍後再試。',
                    'error'
                );
                return null;
            }
        }

        async function checkIn(shift) {
            if (busy) return;
            setBusy(true);
            try {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                if (!userId) {
                    displayMessage('尚未取得 LINE 身分，請關閉後重新開啟。', 'error');
                    return;
                }

                displayMessage(`${shift}：請掃描診所 QR Code…`, 'info');
                const result = await liff.scanCodeV2();
                if (!result || !result.value) {
                    displayMessage('沒有讀取到 QR Code，請重試。', 'error');
                    return;
                }
                const qrContent = String(result.value).trim();
                console.log('QR Code 內容:', qrContent);

                displayMessage('驗證中…', 'info');
                const dailyCode = await getDailyCode();
                if (!dailyCode) return; // getDailyCode 已顯示錯誤訊息

                if (qrContent !== String(dailyCode).trim()) {
                    displayMessage('打卡失敗：QR Code 驗證碼不正確！', 'error');
                    return;
                }

                displayMessage('送出中…', 'info');
                const body = new URLSearchParams({
                    [ENTRY_SHIFT]: shift,
                    [ENTRY_USER]: userId,
                    [ENTRY_CODE]: qrContent
                });
                // no-cors：讀不到 Google 的回應內容，但能確認請求有送出、網路沒斷
                await fetchWithTimeout(FORM_URL, { method: 'POST', mode: 'no-cors', body }, 10000);

                const currentTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
                displayMessage(`已送出打卡\n班別：${shift}\n時間：${currentTime}`, 'success');
            } catch (error) {
                console.error('打卡失敗:', error);
                displayMessage(
                    error.name === 'AbortError'
                        ? '打卡失敗：連線逾時，請重試。'
                        : '打卡失敗，請重試。',
                    'error'
                );
            } finally {
                if (userId) setBusy(false);
            }
        }

        initializeLIFF();
    </script>
</body>
</html>
